<style>
:root{
  --bg:#030503;
  --screen:#06110a;
  --phos:#41ff7d;
  --phos-dim:#2fbf63;
  --phos-faint:rgba(65,255,125,.30);
  --phos-ghost:rgba(65,255,125,.12);
  --bright:#d9ffe6;
  --amber:#ffb347;
  --err:#ff6157;
  --glow:0 0 6px rgba(65,255,125,.40);
  --glow-strong:0 0 4px rgba(65,255,125,.65),0 0 22px rgba(65,255,125,.28);
}
[data-theme="amber"]{
  --screen:#120c02;
  --phos:#ffb000;
  --phos-dim:#c98a10;
  --phos-faint:rgba(255,176,0,.30);
  --phos-ghost:rgba(255,176,0,.12);
  --bright:#ffe9c4;
  --amber:#7dd8ff;
  --glow:0 0 6px rgba(255,176,0,.40);
  --glow-strong:0 0 4px rgba(255,176,0,.65),0 0 22px rgba(255,176,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  height:100%;
  background:var(--bg);
  color:var(--phos);
  font-family:"VT323","Courier New",ui-monospace,monospace;
  font-size:clamp(17px,1.35vw,21px);
  line-height:1.32;
  overflow:hidden;
}
#crt{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 120% 90% at 50% 45%,var(--screen) 0%,var(--bg) 100%);
  display:flex;flex-direction:column;
}
/* CRT overlays: literal-register scanlines + vignette + slow refresh sweep */
#crt::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse 105% 95% at 50% 50%,transparent 62%,rgba(0,0,0,.42) 100%);
}
#crt::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.14;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.85) 2px 3px);
}
#sweep{
  position:absolute;left:0;right:0;height:110px;top:-130px;pointer-events:none;z-index:4;opacity:.5;
  background:linear-gradient(180deg,transparent,var(--phos-ghost) 55%,transparent);
  animation:sweep 9s linear infinite;
}
@keyframes sweep{0%{top:-130px}100%{top:110%}}
#flicker{position:absolute;inset:0;pointer-events:none;z-index:3;background:var(--phos-ghost);opacity:0;animation:flick 7s steps(1) infinite}
@keyframes flick{0%,93%,100%{opacity:0}94%{opacity:.35}95%{opacity:.06}96%{opacity:.22}97%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #sweep,#flicker{animation:none;display:none}
}
/* ---- chrome bars ---- */
header,footer{
  flex:0 0 auto;display:flex;align-items:center;gap:1.4em;
  padding:.42em 1.1em;position:relative;z-index:7;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--phos-dim);
}
header{border-bottom:1px solid var(--phos-faint)}
footer{border-top:1px solid var(--phos-faint);font-size:.92em}
header .brand{color:var(--phos);text-shadow:var(--glow)}
header .sep,footer .sep{opacity:.5}
header nav{margin-left:auto;display:flex;gap:1.2em}
a{color:var(--phos);text-decoration:none;border-bottom:1px dotted var(--phos-faint)}
a:hover,a:focus-visible{color:var(--bright);border-bottom-color:var(--phos);text-shadow:var(--glow)}
:focus-visible{outline:2px dashed var(--phos);outline-offset:3px}
footer .hint{margin-left:auto;color:var(--phos-dim)}
/* ---- terminal ---- */
#term{
  flex:1 1 auto;overflow-y:auto;position:relative;z-index:2;
  padding:1.1em 1.3em 2.2em;
  scrollbar-width:thin;scrollbar-color:var(--phos-dim) transparent;
  text-shadow:var(--glow);
  overscroll-behavior:contain;
}
#term::-webkit-scrollbar{width:8px}
#term::-webkit-scrollbar-thumb{background:var(--phos-faint)}
.line{white-space:pre-wrap;word-break:break-word;min-height:1.32em}
.dim{color:var(--phos-dim);text-shadow:none}
.bright{color:var(--bright)}
.amber{color:var(--amber);text-shadow:0 0 6px rgba(255,179,71,.35)}
.err{color:var(--err);text-shadow:0 0 6px rgba(255,97,87,.35)}
.banner{color:var(--phos);text-shadow:var(--glow-strong);line-height:1.05;font-size:clamp(6px,1.55vw,15px);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.banner-sm{display:none;font-size:clamp(34px,9vw,54px);line-height:.95;text-shadow:var(--glow-strong)}
@media(max-width:640px){.banner{display:none}.banner-sm{display:block}}
.rule{color:var(--phos-faint);text-shadow:none}
/* fresh phosphor: new lines land bright then settle */
.fresh{animation:settle .9s ease-out both}
@keyframes settle{from{color:var(--bright);text-shadow:var(--glow-strong)}to{}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}}
/* ---- prompt ---- */
#promptline{display:flex;align-items:baseline;gap:.55em;padding:0}
#promptline[hidden],#chips[hidden]{display:none}
#ps1{color:var(--phos-dim);white-space:nowrap}
#cmdline{color:var(--bright)}
#cursor{
  display:inline-block;width:.62em;height:1.05em;vertical-align:text-bottom;
  background:var(--phos);box-shadow:var(--glow-strong);
  animation:blink 1.06s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#cursor{animation:none}}
#kbd{position:absolute;opacity:0;left:-9999px;width:1px;height:1px}
/* ---- suggestion chips ---- */
#chips{display:flex;flex-wrap:wrap;gap:.5em .8em;margin:.9em 0 .3em;position:relative;z-index:2}
#chips button{
  font:inherit;background:none;border:1px solid var(--phos-faint);
  color:var(--phos);padding:.06em .6em .1em;cursor:pointer;
  text-shadow:var(--glow);letter-spacing:.02em;
}
#chips button:hover{background:var(--phos-ghost);color:var(--bright);border-color:var(--phos)}
#chips button::before{content:"▸ ";color:var(--phos-dim)}
/* power-off */
#off{position:fixed;inset:0;background:#000;z-index:60;display:none;align-items:center;justify-content:center}
#off.on{display:flex;animation:crtoff .5s ease-in both}
@keyframes crtoff{0%{clip-path:inset(0 0 0 0)}60%{clip-path:inset(49.6% 0 49.6% 0)}100%{clip-path:inset(50% 48% 50% 48%)}}
#off span{color:var(--bright);font-size:1.4em;animation:dotfade 2.4s ease-out both}
@keyframes dotfade{0%,40%{opacity:1}100%{opacity:.25}}
@media(max-width:640px){
  header{gap:.8em;font-size:.9em}
  header .mid{display:none}
  footer .hint{display:none}
  #term{padding:.9em .8em 2em}
}
.sr{position:absolute;left:-9999px}
noscript .line{padding:0 1em}
</style>

  "theme amber":()=>{document.documentElement.dataset.theme="amber";return print([["phosphor set to P3 AMBER — 'theme green' to switch back","amber"]],0)},

};
const ALIASES={"scrape":"webreaper scrape https://webreaper.ai","map":"webreaper map https://webreaper.ai --max-urls 12","crawl":"webreaper crawl https://webreaper.ai","init":"webreaper init","version":"webreaper version","stealth":"climb","mcp":"agent","docs":"man webreaper","?":"help"};
async function doExit(){
  if(reduced){await print([["logout",""],["(there is no escape. the prompt returns.)","dim"]],20);return}
  const off=$("#off");off.classList.add("on");off.setAttribute("aria-hidden","false");
  await sleep(2600);
  off.classList.remove("on");off.setAttribute("aria-hidden","true");
  log.innerHTML="";banner(false);
}
function unknown(c){
  if(/rm\s+-rf/.test(c))return print([["I'm a scraper, not a destroyer. Try 'webreaper scrape' instead.","amber"]],0);
  if(/^webreaper\s+scrape\s+\S+/.test(c))return print([["this demo replays recorded runs only — it doesn't scrape live.","amber"],["install the real thing:  brew install alex-on-ai/webreaper/webreaper","bright"],["…then that exact command will work on your machine.","dim"]],16);
  return print([[`command not found: ${c}`,"err"],["type 'help' for the menu.","dim"]],10);
}
async function run(raw){
  const c=raw.trim();if(!c)return;
  history.push(c);hIdx=history.length;
  addLine("reaper@web:~$ "+c,"dim",false);
  const key=c.toLowerCase();
  const fn=CMDS[c]||CMDS[key]||(ALIASES[key]&&CMDS[ALIASES[key]]);
  busy=true;promptline.hidden=true;chipsBox.hidden=true;
  try{ if(fn)await fn(); else await unknown(c);}finally{
    addLine("","",false);
    busy=false;promptline.hidden=false;chipsBox.hidden=false;
    log.appendChild(chipsBox);log.appendChild(promptline);
    scrollBottom();kbd.focus({preventScroll:true});
  }
}
/* ---------- chips ---------- */
const CHIP_CMDS=[
 ["scrape webreaper.ai","webreaper scrape https://webreaper.ai"],
 ["| jq -r .markdown","webreaper scrape https://webreaper.ai | jq -r .markdown"],
 ["map","webreaper map https://webreaper.ai --max-urls 12"],
 ["climb (bot-protection)","climb"],
 ["install","install"],
 ["library (.NET)","library"],
 ["agent / mcp","agent"],
 ["why","why"],
 ["man webreaper","man webreaper"],
];
for(const [label,cmd] of CHIP_CMDS){
  const b=document.createElement("button");b.type="button";b.textContent=label;
  b.addEventListener("click",()=>{if(!busy)typeAndRun(cmd)});chipsBox.appendChild(b);
}
async function typeAndRun(cmd){
  kbd.value="";cmdline.textContent="";
  if(!reduced){for(let i=0;i<cmd.length;i++){cmdline.textContent=cmd.slice(0,i+1);await sleep(cmd.length>40?6:14)}await sleep(120)}
  cmdline.textContent="";await run(cmd);
}
/* ---------- input ---------- */
document.addEventListener("click",e=>{if(!e.target.closest("a,button")&&booted)kbd.focus({preventScroll:true})});
kbd.addEventListener("input",()=>{cmdline.textContent=kbd.value});
kbd.addEventListener("keydown",e=>{
  if(busy){e.preventDefault();return}
  if(e.key==="Enter"){const v=kbd.value;kbd.value="";cmdline.textContent="";run(v)}
  else if(e.key==="ArrowUp"){e.preventDefault();if(hIdx>0){hIdx--;kbd.value=history[hIdx]||"";cmdline.textContent=kbd.value}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(hIdx<history.length){hIdx++;kbd.value=history[hIdx]||"";cmdline.textContent=kbd.value}}
  else if(e.key==="Tab"){e.preventDefault();const v=kbd.value.toLowerCase();if(!v)return;
    const pool=Object.keys(CMDS).concat(Object.keys(ALIASES));
    const hit=pool.find(k=>k.startsWith(v));if(hit){kbd.value=hit;cmdline.textContent=hit}}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();log.innerHTML="";log.appendChild(chipsBox);log.appendChild(promptline)}
});

  ],26);
  log.appendChild(chipsBox);chipsBox.hidden=false;
  log.appendChild(promptline);promptline.hidden=false;
  booted=true;scrollBottom();
  if(matchMedia("(hover:hover)").matches)kbd.focus({preventScroll:true});

async function boot(){
  if(reduced||sessionStorage.getItem("wr-booted")){await banner();return}
  sessionStorage.setItem("wr-booted","1");
  let skipped=false;
  const skip=()=>{skipped=true};
  addEventListener("keydown",skip,{once:true});addEventListener("pointerdown",skip,{once:true});
  for(const [t,c] of BOOT){
    if(skipped)break;
    addLine(t,c);scrollBottom();await sleep(150);
  }
  await sleep(skipped?0:420);
  log.innerHTML="";
  await banner();
}
boot();
